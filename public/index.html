<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- PWA : installable sur l'écran d'accueil (Android et iPhone) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Calbasse" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background: #fbf5ea;
      }
      body {
        overflow: hidden;
        margin: 0;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Active JavaScript pour utiliser Calbasse.</noscript>
    <div id="root"></div>
    <script>
      // Service worker : l'app s'ouvre même sans réseau (les scans attendent la connexion)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
          // Quelques secondes après l'ouverture (polices et images chargées), on confie la liste
          // des fichiers au service worker pour qu'il les garde hors ligne.
          setTimeout(function () {
            navigator.serviceWorker.ready.then(function (reg) {
              var urls = performance.getEntriesByType('resource').map(function (e) { return e.name; });
              if (reg.active) reg.active.postMessage({ type: 'garder', urls: urls });
            });
          }, 4000);
        });
      }
    </script>
  </body>
</html>
